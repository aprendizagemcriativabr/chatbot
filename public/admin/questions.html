<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin RBAC - Perguntas</title>
    <link rel="icon" type="image/svg+xml" href="/admin/assets/favicon.svg" />
    <link rel="stylesheet" href="/admin/assets/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <div class="row wrap row-between">
          <div>
            <h1>Perguntas</h1>
            <p>Edite localmente e clique em salvar para sincronizar todas as perguntas.</p>
          </div>
          <a class="button-link secondary" href="/admin/select">Voltar</a>
        </div>

        <div id="questions-list" class="question-list"></div>

        <div class="panel-actions">
          <button class="secondary" id="add-button" type="button">Adicionar pergunta</button>
          <button class="secondary" id="reload-button" type="button">Recarregar</button>
          <button class="primary" id="save-button" type="button">Salvar</button>
        </div>

        <div id="feedback" class="feedback hidden"></div>
      </section>
    </main>

    <script src="/admin/assets/admin-shared.js" defer></script>
    <script src="/admin/assets/questions.js" defer></script>
  </body>
</html>
